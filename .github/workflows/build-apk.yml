name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Write android/local.properties for CI
        working-directory: app/android
        run: |
          FLUTTER_SDK=$(dirname "$(dirname "$(readlink -f "$(which flutter)")")")
          echo "flutter.sdk=$FLUTTER_SDK" > local.properties
          echo "sdk.dir=$ANDROID_HOME" >> local.properties
          cat local.properties

      - name: Set up Gradle (to regenerate the wrapper jar)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Regenerate Gradle wrapper files
        working-directory: app/android
        run: gradle wrapper --no-daemon

      - name: Generate placeholder launcher icons
        working-directory: app/android/app/src/main/res
        run: |
          python3 - <<'PYEOF'
          import os, struct, zlib
          def png(size, rgb):
              def chunk(typ, data):
                  c = struct.pack(">I", len(data)) + typ + data
                  c += struct.pack(">I", zlib.crc32(typ + data) & 0xffffffff)
                  return c
              ihdr = struct.pack(">IIBBBBB", size, size, 8, 2, 0, 0, 0)
              row = b"\x00" + bytes(rgb) * size
              idat = zlib.compress(row * size)
              return (b"\x89PNG\r\n\x1a\n" + chunk(b"IHDR", ihdr)
                      + chunk(b"IDAT", idat) + chunk(b"IEND", b""))
          for folder, size in [("mipmap-mdpi", 48), ("mipmap-hdpi", 72), ("mipmap-xhdpi", 96), ("mipmap-xxhdpi", 144), ("mipmap-xxxhdpi", 192)]:
              os.makedirs(folder, exist_ok=True)
              with open(os.path.join(folder, "ic_launcher.png"), "wb") as f:
                  f.write(png(size, (16, 16, 24)))
              print(folder, size, "ok")
          PYEOF
          ls -la mipmap-*/ic_launcher.png

      - name: Use fixed debug keystore
        run: |
            mkdir -p ~/.android
            cp keystore/debug.keystore ~/.android/debug.keystore
                
        - name: Build debug APK
        working-directory: app
        run: flutter build apk --debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dexterchat-debug-apk
          path: app/build/app/outputs/flutter-apk/app-debug.apk

      - name: Publish APK to a GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: DexterChat build ${{ github.run_number }}
          prerelease: true
          files: app/build/app/outputs/flutter-apk/app-debug.apk
