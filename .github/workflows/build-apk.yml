name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle (to regenerate the wrapper jar)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Regenerate Gradle wrapper files
        working-directory: app/android
        run: gradle wrapper --no-daemon

      - name: Generate placeholder launcher icons
        working-directory: app/android/app/src/main/res
        run: |
          for spec in "mipmap-mdpi 48" "mipmap-hdpi 72" "mipmap-xhdpi 96" "mipmap-xxhdpi 144" "mipmap-xxxhdpi 192"; do
            set -- $spec
            mkdir -p "$1"
            convert -size "${2}x${2}" xc:"#101018" "$1/ic_launcher.png" || magick -size "${2}x${2}" xc:"#101018" "$1/ic_launcher.png"
          done
          ls -la mipmap-*/ic_launcher.png

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build debug APK
        working-directory: app
        run: flutter build apk --debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dexterchat-debug-apk
          path: app/build/app/outputs/flutter-apk/app-debug.apk

      - name: Publish APK to a GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: DexterChat build ${{ github.run_number }}
          prerelease: true
          files: app/build/app/outputs/flutter-apk/app-debug.apk
