name: dexter_chat
description: DexterChat — private, invite-only, end-to-end encrypted messenger.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.1.0
  http: ^1.2.2
  web_socket_channel: ^3.0.1
  pinenacl: ^0.6.0
  flutter_secure_storage: ^9.2.2
  web3dart: ^3.0.3
  record: ^6.1.2
  audioplayers: ^6.4.0
  image_picker: ^1.1.2
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
